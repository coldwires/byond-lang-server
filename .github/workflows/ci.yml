name: CI

# The managed tests run once - they are platform-independent - while the native job runs per RID,
# because NativeAOT produces a separate binary for each and the C ABI is the thing most likely to
# break in a platform-specific way. See PLAN.md §M0.
#
# The byond-fixtures job is the third axis and the only one that runs the REAL COMPILER. Without it
# CI asserts that our parser still agrees with our parser: the `test` job runs on Linux, so every
# compiler-backed fixture takes its SkippableFact path and the whole tests/fixtures suite - the
# goldens, the runtime world, the probe ratchet - reports as skipped. That is the half which can
# catch a BYOND release changing what DM means, and it was local-only until it was wired up here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # The compiler the fixtures are recorded against. Pinned rather than floating: a job that always
  # fetched the newest build would go red on BYOND's release schedule instead of on a commit, and
  # the failure would name no change of ours. Bumping this is a deliberate edit, and it comes with
  # re-reading what moved and updating tests/fixtures/BYOND_VERSION.txt in the same change - the
  # procedure is in tests/fixtures/README.md.
  BYOND_BUILD: '516.1686'

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # Everything that needs the real dm.exe. Windows-only because BYOND is, and no runner ships it -
  # so the standalone zip is fetched and DM_BYOND_BIN points at it, exactly as a local run against
  # a build you have not installed does.
  byond-fixtures:
    name: fixtures against the real compiler
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The standalone zip needs no installer, no licence prompt and no registry: it expands to a
      # byond/bin holding dm.exe and dreamdaemon.exe, which is all the suite wants. Cached because
      # it is ~9 MB and never changes for a given build number.
      - name: Cache BYOND ${{ env.BYOND_BUILD }}
        id: byond-cache
        uses: actions/cache@v4
        with:
          path: byond-dist
          key: byond-${{ env.BYOND_BUILD }}

      # byond.com sits behind Cloudflare and serves a MANAGED CHALLENGE to datacenter egress: the
      # first run of this job got "Just a moment..." HTML instead of a zip. It downloads fine from
      # a residential address with a browser User-Agent, which is why this passed every local test
      # and failed on its first real runner.
      #
      # A UA is sent because byond.com does filter on it (a bare fetcher gets 403 even locally),
      # and it is worth the attempt - but a managed challenge wants JavaScript, so this may simply
      # not be winnable from GitHub's IP ranges. It is therefore NOT fatal: see the next step.
      - name: Fetch BYOND ${{ env.BYOND_BUILD }}
        id: byond-fetch
        if: steps.byond-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $build = "${env:BYOND_BUILD}"
          $url = "https://www.byond.com/download/build/$($build.Split('.')[0])/${build}_byond.zip"
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          foreach ($attempt in 1..3) {
            try {
              Write-Host "fetching $url (attempt $attempt)"
              Invoke-WebRequest -Uri $url -OutFile byond.zip -UseBasicParsing -UserAgent $ua -TimeoutSec 120

              # A challenge page is served with 200 and is a few KB of HTML, so the status code
              # proves nothing - check we actually got an archive.
              $size = (Get-Item byond.zip).Length
              if ($size -lt 1MB) {
                throw "got $size bytes, which is a challenge page rather than the archive"
              }

              Expand-Archive byond.zip -DestinationPath byond-dist -Force
              Write-Host "expanded $size bytes"
              exit 0
            }
            catch {
              Write-Host "attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
            }
          }

          Write-Host "::warning::could not fetch BYOND $build - Cloudflare challenge on the runner"
          exit 1

      # Fail here with a clear message rather than letting every fixture report "no dm.exe" and
      # pass as a skip, which is the one outcome this job exists to prevent. A skip is honest
      # locally and is a silent hole here, so the compiler's presence is asserted rather than
      # assumed, and its VERSION is checked too - a cache or a moved zip serving a different build
      # would otherwise measure the wrong compiler against goldens recorded for this one.
      - name: Check the compiler is the build we asked for
        id: byond-check
        shell: pwsh
        run: |
          # dm.exe with no arguments prints its banner and usage and then exits 1. That is not a
          # failure, but GitHub's pwsh aborts a step on a native non-zero exit and again on a
          # non-zero $LASTEXITCODE at the end - so both are neutralised deliberately.
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'

          $bin = Join-Path (Get-Location) 'byond-dist\byond\bin'
          $dm = Join-Path $bin 'dm.exe'

          # No compiler means the fetch lost to Cloudflare, which is an INFRASTRUCTURE result and
          # not a finding about this commit. Reporting it red would put a permanent failure on
          # every run, and a gate that is always red stops being read - the same reasoning that
          # keeps deliberate divergences out of the diagdiff column. It is loud and it is amber.
          if (-not (Test-Path $dm)) {
            Write-Host "::warning::no dm.exe - the compiler-backed half did NOT run this build"
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $banner = & $dm 2>$null
          $hit = $banner | Select-String -Pattern 'version\s+([0-9][0-9.]*)' | Select-Object -First 1
          if (-not $hit) {
            Write-Host "::error::could not read a version out of dm.exe's banner"
            exit 1
          }

          $reported = $hit.Matches[0].Groups[1].Value
          Write-Host "dm.exe reports $reported, expected $env:BYOND_BUILD"
          if ($reported -ne $env:BYOND_BUILD) {
            Write-Host "::error::fetched build is $reported but BYOND_BUILD says $env:BYOND_BUILD"
            exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DM_BYOND_BIN=$bin"
          exit 0

      # DM_BYOND_BIN is read by FixtureTests and by `dmc diagdiff`, so this run compiles, runs and
      # diffs against the fetched build and nothing falls back to an install that is not there.
      #
      # The whole managed suite runs, not just the fixtures: on Linux the compiler-backed cases
      # skip, so this is the only place their assertions are ever executed.
      - name: Test with the real compiler
        if: steps.byond-check.outputs.available == 'true'
        run: dotnet test -c Release --verbosity normal

      # xunit covers the compile-and-diff half. run.ps1 adds the one thing it is a poor fit for:
      # running the compiled world under DreamDaemon. Every push and every PR pays for this,
      # because it is the tier that catches a BYOND release changing what DM MEANS rather than
      # what it accepts - a silent behaviour change shows up here as a wrong value and nowhere
      # else.
      # The 252-probe ratchet rides along on pushes to main and on demand, and is left off pull
      # requests: it is 252 compiles plus 252 diagdiffs, minutes rather than seconds, and it is a
      # coverage FLOOR rather than a correctness gate - it fails only if agreement drops. A PR
      # that lowers it fails at merge, on the commit that did it. One invocation either way, since
      # run.ps1 -Probes does everything the plain run does and then some.
      - name: Runtime world${{ github.event_name != 'pull_request' && ' and the probe ratchet' || '' }}
        if: steps.byond-check.outputs.available == 'true'
        shell: pwsh
        run: |
          # A HASHTABLE, not an array. Array splatting passes elements POSITIONALLY, so
          # @('-Byond', $path) hands run.ps1 two positional arguments and it rejects the second
          # with "a positional parameter cannot be found that accepts argument ...". Named
          # parameters splat from a hashtable. (And not $args either - automatic variable.)
          # RuntimeOptional: a hosted runner cannot start DreamDaemon at all - it dies in five
          # seconds with 0xC0000135, STATUS_DLL_NOT_FOUND, on an image that lacks something the
          # daemon links against. Everything else in the suite still GATES here; only the runtime
          # world downgrades to a skip, because failing every build on a gap no one can close from
          # CI puts a permanent red on the board and a permanent red stops being read.
          #
          # The consequence, so it is not discovered later: the tier that catches a BYOND release
          # changing what DM MEANS rather than what it accepts runs LOCALLY ONLY. The failure path
          # prints the daemon's unresolved imports, so if that names an installable component this
          # can be turned back on.
          $runArgs = @{ Byond = $env:DM_BYOND_BIN; RuntimeOptional = $true }
          if ('${{ github.event_name }}' -ne 'pull_request') { $runArgs['Probes'] = $true }

          & .\tests\fixtures\run.ps1 @runArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One RID failing should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     rid: linux-x64 }
          - { os: ubuntu-24.04-arm,  rid: linux-arm64 }
          - { os: windows-latest,    rid: win-x64 }
          # 32-bit exists for the DreamMaker patcher, which must load into a 32-bit MFC host.
          # It earns its place in the matrix: the handle table packed a generation into the
          # high 32 bits of a pointer and silently had none here, which x64 could never catch.
          - { os: windows-latest,    rid: win-x86 }
          # macos-15-intel, NOT macos-13: that image was retired, and a job asking for a label
          # that no longer exists does not fail - it QUEUES FOREVER. osx-x64 sat unstarted for an
          # hour across six runs and read as "slow" rather than "never".
          - { os: macos-15-intel,    rid: osx-x64 }
          - { os: macos-latest,      rid: osx-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # NativeAOT links with clang and needs zlib's headers. The SDK does not bring either.
      - name: Install the AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # Without vswhere on PATH the ILCompiler targets splice a "'vswhere.exe' is not recognized"
      # string into the link command and fail with MSB3073, while blaming link.exe - which was
      # found. Cost an afternoon locally; see PLAN.md §8.
      - name: Put vswhere on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer"
          if (Test-Path $installer) {
            Add-Content -Path $env:GITHUB_PATH -Value $installer
          } else {
            Write-Error "vswhere's directory is missing; the AOT publish will fail misleadingly"
          }

      - name: Publish dm_core
        run: dotnet publish src/Dm.Native/Dm.Native.csproj -c Release -r ${{ matrix.rid }}

      - name: Check the binary survived
        shell: bash
        run: |
          publish="src/Dm.Native/bin/Release/net9.0/${{ matrix.rid }}/publish"
          ls -l "$publish"

          # Windows Defender has quarantined a freshly published dm_core.dll locally, and the
          # publish still reports success - so the file's absence is the only symptom. Fail here
          # with a clear message rather than in the CMake copy step with a wall of MSB3073.
          #
          # NativeAOT does NOT prefix the Unix outputs with `lib`: the artifacts are dm_core.so and
          # dm_core.dylib. Checking for libdm_core.* found nothing on Linux and macOS.
          #
          # And the test is a loop rather than `ls a b c | grep -q .`, because GitHub runs bash
          # with `set -eo pipefail`: `ls` exits non-zero for every name that does not exist, which
          # poisons the pipeline even when a later name DID match. That is why this step failed on
          # Windows too, where dm_core.dll was sitting right there in the listing above it.
          found=""
          for name in dm_core.dll dm_core.so dm_core.dylib; do
            if [ -f "$publish/$name" ]; then
              found="$name"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "::error::no dm_core binary in $publish - antivirus quarantine is the usual cause"
            exit 1
          fi

          echo "found $found"

      # Every RID in the matrix runs on its own architecture, so each one really executes rather
      # than just linking.
      - name: Build and run the ABI smoke test
        shell: bash
        run: |
          # MSVC defaults to a 64-bit target whatever the RID says, so the 32-bit build needs the
          # generator platform set or it links x64 objects against an x86 import library.
          arch=""
          if [ "${{ matrix.rid }}" = "win-x86" ]; then
            arch="-A Win32"
          fi

          cmake -S tests/abi-smoke -B build/abi-smoke -DCMAKE_BUILD_TYPE=Release -DDM_RID=${{ matrix.rid }} $arch
          cmake --build build/abi-smoke --config Release

          # The CMakeLists copies the DLL next to the executable as a POST_BUILD step, which is
          # what a client should copy verbatim. Doing it again here costs nothing and keeps the
          # run from depending on that step: it has been seen to fail on a machine without pwsh,
          # and the failure looks like a linker problem rather than a missing file.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "src/Dm.Native/bin/Release/net9.0/${{ matrix.rid }}/publish/dm_core.dll" \
               build/abi-smoke/Release/ 2>/dev/null || true
          fi

          ctest --test-dir build/abi-smoke -C Release --output-on-failure

      - name: Upload the native binary
        uses: actions/upload-artifact@v4
        with:
          name: dm_core-${{ matrix.rid }}
          path: |
            src/Dm.Native/bin/Release/net9.0/${{ matrix.rid }}/publish/dm_core.dll
            src/Dm.Native/bin/Release/net9.0/${{ matrix.rid }}/publish/dm_core.so
            src/Dm.Native/bin/Release/net9.0/${{ matrix.rid }}/publish/dm_core.dylib
            src/Dm.Native/bin/Release/net9.0/${{ matrix.rid }}/native/dm_core.lib
          if-no-files-found: error
